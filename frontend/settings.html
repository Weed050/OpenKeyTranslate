<!-- frontend/settings.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenKeyTranslate - Settings</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>

    <div class="app-shell">
        <nav class="sidebar">
            <div class="sidebar-brand">OpenKeyTranslate</div>

            <div class="sidebar-section">
                <div class="sidebar-label">Active</div>
                <div id="sidebarActive"></div>
            </div>

            <div class="sidebar-section hidden" id="sidebarArchivedSection">
                <div class="sidebar-label">Archived</div>
                <div id="sidebarArchived"></div>
            </div>

            <div class="sidebar-footer">
                <div class="hidden" id="sidebarProjectLinks"></div>
                <a class="sidebar-link" href="index.html">Dashboard</a>
                <a class="sidebar-link" href="settings.html">Settings</a>
            </div>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <h1>Settings</h1>
            </div>

            <div class="card">
                <h2>Workspace</h2>
                <div class="row">
                    <div>
                        <div class="text-muted">Main workspace folder (database + projects)</div>
                        <div class="text-mono" id="currentWorkspacePath">Loading...</div>
                    </div>
                    <button class="copy-btn" id="copyWorkspaceBtn" title="Copy path">Copy</button>
                </div>
                <div style="display:flex; gap:8px; margin-top:12px;">
                    <button id="changeWorkspaceBtn">Change workspace folder...</button>
                    <button id="resetWorkspaceBtn" class="danger">Reset to default (AppData)</button>
                </div>
                <p class="text-muted" id="settingsStatus" style="margin-top:10px;"></p>
            </div>

            <div class="card">
                <h2>Correction memory</h2>
                <div class="row">
                    <div class="text-muted">Minimum words to store a correction (0 = store everything, even one-word edits)</div>
                    <input type="text" id="memoryMinWordsInput" style="max-width:80px;" inputmode="numeric">
                </div>
                <button id="saveMemorySettingsBtn" class="primary">Save</button>
                <p class="text-muted" id="memorySettingsStatus" style="margin-top:10px;"></p>
            </div>
        </main>
    </div>

    <script type="module" src="js/settings.js"></script>
</body>
</html>
