<!-- frontend/editor.html -->
 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/okt-logo.svg" type="image/svg+xml">
    <link rel="alternate icon" href="img/okt.ico">
    <title>OpenKeyTranslate - Editor</title>
    <link rel="stylesheet" href="css/tokens.css">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/help.css">
    <script src="js/help.js" defer></script>
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/pagepicker.css">
    <link rel="stylesheet" href="css/dialogs.css">
</head>
<body>
 
    <div class="app-shell">
        <nav class="sidebar">
            <div class="sidebar-brand"><img src="img/okt-logo.svg" alt="" class="brand-icon">OpenKeyTranslate</div>
 
            <div class="sidebar-section">
                <div class="sidebar-label">Active</div>
                <div id="sidebarActive"></div>
            </div>
 
            <div class="sidebar-section hidden" id="sidebarArchivedSection">
                <div class="sidebar-label">Archived</div>
                <div id="sidebarArchived"></div>
            </div>
 
            <div class="sidebar-footer">
                <div class="hidden" id="sidebarProjectLinks"></div>
                <a class="sidebar-link" href="index.html">Projects</a>
                <a class="sidebar-link" href="settings.html">Settings</a>
            </div>
        </nav>
 
        <main class="main-content no-scroll">
 
            <div class="editor-layout hidden" id="editorLayout">
                <div class="image-pane">
                    <div class="image-toolbar">
                        <button id="prevPageBtn" class="icon-btn" title="Previous page">&larr;</button>
                        <span id="pageLabel"></span>
                        <button id="nextPageBtn" class="icon-btn" title="Next page">&rarr;</button>
                        <button id="nextToReviewBtn" class="icon-btn" title="Next page to review: the first page after this one whose translation is not reviewed yet (with the review mode &quot;accept text + layout&quot;: not fully reviewed). Skips pages that are done.">&raquo;</button>
                        <span class="toolbar-sep"></span>
                        <!-- most used first; rare page tools in More (nothing wraps out of sight) -->
                        <button id="retranslateBtn" class="icon-btn" title="Re-run translation only. Bubbles you edited are kept (Shift+click overwrites them too)">Retranslate</button>
                        <button id="reocrBtn" class="icon-btn" title="Run OCR + inpainting again on this page. Translations of bubbles whose text did not change are kept">Re-OCR</button>
                        <button id="cleanAreaBtn" class="icon-btn" title="Draw a rectangle over a leftover trace (pale ghost of a letter, a smudge): it is painted with the plain colour around it, or filled from the surroundings on artwork. Kept by Rebuild image and Re-OCR (Esc cancels)">Clean area</button>
                        <button id="undoCleanBtn" class="icon-btn hidden" title="Undo a cleaned area of this page: with several, pick which one from the list (Shift+click: remove all of them)">Undo clean</button>
                        <button id="reinpaintBtn" class="icon-btn" title="Rebuild the clean image from the original (after deleting / skipping bubbles) - no OCR, no translation">Rebuild image</button>
                        <button id="addBubbleBtn" class="icon-btn" title="Draw a rectangle over text the OCR missed - it is read and added as a new bubble (Esc cancels)">Add bubble</button>
                        <select id="orderSelect" class="toolbar-select" title="Reading order of the bubbles of this page - picking one sorts the page at once (Undo in the message). There is no panel detection - fix single bubbles with Move up / down.">
                            <option value="ttb">Order: top to bottom</option>
                            <option value="rtl">Order: right to left</option>
                            <option value="ltr">Order: left to right</option>
                            <option disabled>──────────</option>
                            <option value="chapter">Use this order for the whole chapter…</option>
                            <option value="project">Use this order for the whole project…</option>
                        </select>
                        <button id="previewBtn" class="icon-btn" title="Show the page with the translation typeset into the bubbles (the clean page is shown otherwise). Download from the page list: Export translated pages.">Preview text</button>
                        <button id="originalBtn" class="icon-btn" title="Show the ORIGINAL page as imported (text not erased) - to see what the OCR or the cleaning missed. Click again to go back (shortcut: O).">Original</button>
                        <button id="ocrDebugBtn" class="icon-btn hidden" title="OCR debug view: every raw OCR reading with its confidence, second-chance readings, readings under the threshold, what later steps removed and the slice cuts. (This button: Settings &gt; Editor.)">OCR debug</button>
                        <span class="toolbar-sep"></span>
                        <button id="zoomOutBtn" class="icon-btn" title="Zoom out (Ctrl + scroll down)">&minus;</button>
                        <span id="zoomLabel">100%</span>
                        <button id="zoomInBtn" class="icon-btn" title="Zoom in (Ctrl + scroll up)">+</button>
                        <span style="margin-left:auto"></span>
                        <details class="toolbar-more" id="toolbarMore">
                            <summary class="icon-btn" title="View and page tools">More &#9662;</summary>
                            <div class="toolbar-more-menu">
                                <button id="zoomFitWidthBtn" class="icon-btn" title="Fit page width to ~80% of the viewport">Fit width</button>
                                <button id="zoomResetBtn" class="icon-btn" title="Reset zoom to fit the viewport height">Fit height</button>
                                <button id="resetLayoutBtn" class="icon-btn" title="Reset panel sizes to default">Reset layout</button>
                                <hr>
                                <span id="pageToolsMenu" class="toolbar-more-group"></span>
                            </div>
                        </details>
                    </div>
                    <div class="image-viewport" id="imageViewport">
                        <div class="image-state hidden" id="imageState"></div>
                        <div class="image-canvas hidden" id="imageCanvas">
                            <img id="pageImage" alt="Page">
                        </div>
                    </div>
                    <!-- Translate / Lettering switch + Export page (js/editor-lettering.js renderModeBar) -->
                    <div class="mode-bar" id="modeBar"></div>
                </div>

                <div class="panel-resizer-x" id="panelResizerX" title="Drag to resize"></div>

                <div class="side-panel" id="sidePanel">
                    <details class="chapter-nav" id="chapterNav">
                        <summary>Chapters &amp; pages</summary>
                        <div class="chapter-nav-body" id="chapterNavBody"></div>
                    </details>

                    <div class="bubble-list-header" id="bubbleListHeader">Bubbles</div>
                    <div class="bubble-list" id="bubbleList"></div>

                    <div class="panel-resizer-y" id="panelResizerY" title="Drag to resize"></div>

                    <div class="bubble-detail hidden" id="bubbleDetail"></div>
                </div>
            </div>
 
            <div class="image-state" id="processPrompt" style="margin:auto; max-width:420px;">
                <div id="processPromptInfo"></div>
                <p id="processPromptMsg">This page hasn't been processed yet.</p>
                <button id="processBtn" class="primary">Run OCR + translation</button>
                <p class="text-muted" id="processStatus"></p>
                <p class="text-muted text-mono hidden" id="processPromptError" style="white-space:pre-wrap; text-align:left;"></p>
                <div style="display:flex; gap:8px; justify-content:center; margin-top:8px;">
                    <button id="showRawBtn" title="Reveal the raw image file in the file explorer">Show file</button>
                    <button id="excludePromptBtn" class="danger" title="Remove this page from the list (file stays on disk, 'Show excluded' restores it)">Exclude page</button>
                </div>
                <!-- next to an unprocessed page without a detour through the page list (also Ctrl+arrow keys) -->
                <div class="process-nav">
                    <button id="promptPrevBtn" title="Previous page">&larr; Previous page</button>
                    <button id="promptNextBtn" title="Next page">Next page &rarr;</button>
                </div>
                <p style="margin-top:12px;"><a id="backToPagesLink" href="#">&larr; Back to page list</a></p>
            </div>
 
            <div class="hidden" id="pagePicker">
                <div class="page-picker-inner">
                    <a class="page-picker-back" href="index.html" title="Back to the project list">&larr; Projects</a>
                    <h1>Pages</h1>
                    <div class="hidden page-picker-controls" id="pagePickerControls">
                        <div class="controls-left">
                            <input type="text" id="pageSearchInput" placeholder="Filter by filename...">
                            <button id="collapseAllBtn">Collapse all</button>
                            <button id="expandAllBtn">Expand all</button>
                            <button id="goToNextUnprocessedBtn">Go to next unprocessed</button>
                            <button id="chapterViewBtn" title="Switch between a grid of chapter cards and a single column">Layout: grid</button>
                        </div>

                        <!-- view tools at the right edge: what is shown and in which order (accent outline when not default) -->
                        <div class="page-view-tools" id="pageViewTools">
                            <details class="stage-filter" id="stageFilter">
                                <summary id="stageFilterBtn" class="stage-filter-btn" title="Show only pages in chosen stages (OCR done, translated by the AI, reviewed...)">
                                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5z"/></svg>
                                    Status <span class="filter-count"></span>
                                </summary>
                                <div class="stage-filter-menu" id="stageFilterMenu"></div>
                            </details>
                            <span class="sort-group">
                                <label for="chapterSortSelect" class="sort-label">Sort</label>
                                <select id="chapterSortSelect" class="chapter-sort" title="Order of the chapter cards">
                                    <option value="number">Chapter number</option>
                                    <option value="progress">Progress</option>
                                    <option value="reviewed">Share reviewed</option>
                                    <option value="updated">Last worked on</option>
                                    <option value="name">Name</option>
                                </select>
                                <button type="button" id="chapterSortDir" class="sort-dir" title="Ascending - click to reverse">&uarr;</button>
                            </span>
                        </div>

                        <div class="controls-right">
                            <button id="addChaptersBtn" class="primary">Import new chapters...</button>
                            <button id="exportPagesBtn" title="Write pages as image files - with the translation, clean or both; PNG or JPG; into the project's exported folder or another one, optionally as one ZIP (selected chapters, or all when none is ticked)">Export pages...</button>
                            <button id="openExportedBtn" title="Open the project's exported folder (project folder > exported) in the file explorer">Exported files</button>
                            <button id="replaceTranslationsBtn" title="Find &amp; replace in the translations of every page of the project (e.g. a term you changed your mind about) - preview first">Find &amp; replace...</button>
                            <button id="rescanBtn" title="Compare the project folders on disk with the database right now (new / missing page files, wrong statuses)">Rescan folders</button>
                            <button id="deleteSelectedChaptersBtn" class="danger" disabled>Delete selected</button>
                            <label class="checkbox-label">
                                <input type="checkbox" id="showExcludedCheckbox"> Show excluded
                            </label>
                        </div>
                    </div>
                    <div id="pagePickerBody"></div>
                </div>
            </div>
 
        </main>
    </div>
 
    <div class="save-toast" id="saveToast">Saved</div>

    <button id="scrollToTopBtn" aria-label="Back to top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
    </button>
 
    <script type="module" src="js/editor.js"></script>
</body>
</html>
