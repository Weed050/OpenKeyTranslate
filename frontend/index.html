<!-- frontend/index.html -->
 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenKeyTranslate - Projects</title>
    <link rel="stylesheet" href="css/tokens.css">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/help.css">
    <script src="js/help.js" defer></script>
</head>
<body>
 
    <div class="app-shell">
        <nav class="sidebar">
            <div class="sidebar-brand">OpenKeyTranslate</div>
 
            <div class="sidebar-section">
                <div class="sidebar-label">Active</div>
                <div id="sidebarActive"></div>
            </div>
 
            <div class="sidebar-section hidden" id="sidebarArchivedSection">
                <div class="sidebar-label">Archived</div>
                <div id="sidebarArchived"></div>
            </div>
 
            <div class="sidebar-footer">
                <div class="hidden" id="sidebarProjectLinks"></div>
                <a class="sidebar-link" href="index.html">Projects</a>
                <a class="sidebar-link" href="settings.html">Settings</a>
            </div>
        </nav>
 
        <main class="main-content">
            <div class="dash-column">
                <div class="page-header">
                    <h1>Projects</h1>
                </div>

                <div id="projectList"></div>

                <div class="dash-section-title">New project</div>
                <div class="card create-card">
                    <h2>Create new project</h2>
                    <p class="text-muted">Pick the folder with the scans - one sub-folder per chapter (Chapter_1, Chapter_2, …). More chapters can be added later from the project page.</p>
                    <div class="create-fields">
                        <div>
                            <label for="projectName">Project name</label>
                            <input type="text" id="projectName" placeholder="e.g. Bleach">
                        </div>
                        <div>
                            <label>Scans folder</label>
                            <div style="display:flex; gap:8px; align-items:center;">
                                <button id="selectFolderBtn">Select folder...</button>
                                <span id="pathPreview" class="text-muted text-mono">None selected</span>
                            </div>
                        </div>
                        <div>
                            <button id="importBtn" class="primary">Create project</button>
                            <span id="statusMsg" class="text-muted"></span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
 
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
