# Second line of defence after .githooks/pre-commit: scans every push / PR with gitleaks (+ .gitleaks.toml).
# It runs AFTER the push, so it reports a leak but cannot keep it private - the real block on GitHub is
# Settings -> Code security -> Secret scanning + Push protection.
name: secret-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
